<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Claims Agent Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #1E40AF;
    --blue-hover: #1e3a8a;
    --green: #16A34A;
    --orange: #D97706;
    --red: #DC2626;
    --text: #111827;
    --text-muted: #6B7280;
    --border: #E5E7EB;
    --border-strong: #D1D5DB;
    --bg: #F9FAFB;
    --bg-card: #FFFFFF;
    --bg-hover: #F3F4F6;
    --bg-selected: #EFF6FF;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--text);
    background: var(--bg);
    font-size: 14px;
    line-height: 1.5;
  }

  button { font-family: inherit; cursor: pointer; }

  .app {
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* Sidebar */
  .sidebar {
    width: 240px;
    flex-shrink: 0;
    background: var(--bg-card);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 0;
  }

  .sidebar-section { padding: 8px 0; }

  .section-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px 6px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot.orange { background: var(--orange); }
  .dot.green { background: var(--green); }
  .dot.red { background: var(--red); }

  .claim-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: background 0.1s;
  }
  .claim-item:hover { background: var(--bg-hover); }
  .claim-item.selected {
    background: var(--bg-selected);
    border-left-color: var(--blue);
  }

  .claim-thumb {
    width: 36px;
    height: 36px;
    border-radius: 4px;
    object-fit: cover;
    background: var(--bg-hover);
    flex-shrink: 0;
  }

  .claim-meta { flex: 1; min-width: 0; }
  .claim-id { font-size: 11px; color: var(--text-muted); font-weight: 500; }
  .claim-name {
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .claim-conf {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  /* Main panel */
  .main {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .main-toolbar {
    display: flex;
    gap: 4px;
    padding: 12px 24px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
  }

  .tab {
    padding: 8px 14px;
    background: transparent;
    border: none;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    border-radius: 6px;
  }
  .tab:hover { background: var(--bg-hover); color: var(--text); }
  .tab.active { background: var(--bg-selected); color: var(--blue); }

  .main-content {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
  }

  /* Claim header */
  .claim-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
  }
  .claim-header-left { display: flex; flex-direction: column; gap: 4px; }
  .claim-header-id {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 500;
    letter-spacing: 0.04em;
  }
  .claim-header-name {
    font-size: 22px;
    font-weight: 600;
    margin: 0;
  }
  .claim-header-date {
    font-size: 13px;
    color: var(--text-muted);
  }
  .claim-header-value {
    font-size: 24px;
    font-weight: 600;
    color: var(--text);
  }
  .claim-header-value-label {
    font-size: 12px;
    color: var(--text-muted);
    text-align: right;
  }

  /* Routing banner */
  .banner {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-radius: 6px;
    border: 1px solid;
    margin-bottom: 24px;
    font-size: 13px;
  }
  .banner.orange {
    background: #FFFBEB;
    border-color: #FDE68A;
    color: #92400E;
  }
  .banner.green {
    background: #F0FDF4;
    border-color: #BBF7D0;
    color: #166534;
  }
  .banner.red {
    background: #FEF2F2;
    border-color: #FECACA;
    color: #991B1B;
  }
  .banner-title { font-weight: 600; }
  .banner-rationale { color: inherit; opacity: 0.85; }

  /* Two-column */
  .columns {
    display: grid;
    grid-template-columns: 60% 40%;
    gap: 24px;
    margin-bottom: 24px;
  }

  .photo-main {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-hover);
    display: block;
  }

  .photo-thumbs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 8px;
  }
  .photo-thumb {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--bg-hover);
    cursor: pointer;
  }
  .photo-thumb:hover { border-color: var(--blue); }

  /* Assessment card */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 20px;
  }
  .card-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    margin: 0 0 16px 0;
  }
  .field { margin-bottom: 14px; }
  .field-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 500;
    margin-bottom: 4px;
  }
  .field-value {
    font-size: 14px;
    color: var(--text);
    font-weight: 500;
  }

  .severity-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
  }
  .severity-Minor { background: #DCFCE7; color: #166534; }
  .severity-Moderate { background: #FEF3C7; color: #92400E; }
  .severity-Severe { background: #FEE2E2; color: #991B1B; }

  .confidence-section { margin-top: 18px; }
  .confidence-row {
    margin-bottom: 10px;
  }
  .confidence-row:last-child { margin-bottom: 0; }
  .confidence-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-bottom: 4px;
  }
  .confidence-bar-wrap {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .confidence-bar {
    height: 100%;
    border-radius: 3px;
    transition: width 0.3s;
  }
  .conf-high { background: var(--green); }
  .conf-mid { background: var(--orange); }
  .conf-low { background: var(--red); }

  /* Action bar */
  .action-bar {
    display: flex;
    gap: 12px;
    padding: 16px 0 0;
    border-top: 1px solid var(--border);
    margin-top: 8px;
  }

  .btn {
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    border: 1px solid transparent;
    transition: all 0.1s;
  }
  .btn-primary {
    background: var(--blue);
    color: white;
  }
  .btn-primary:hover { background: var(--blue-hover); }
  .btn-secondary {
    background: white;
    color: var(--text);
    border-color: var(--border-strong);
  }
  .btn-secondary:hover { background: var(--bg-hover); }
  .btn-ghost {
    background: transparent;
    color: var(--text-muted);
    border: none;
  }
  .btn-ghost:hover { color: var(--text); }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(17, 24, 39, 0.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: white;
    border-radius: 8px;
    width: 480px;
    max-width: 90%;
    padding: 24px;
  }
  .modal-title {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 16px 0;
  }
  .modal-field { margin-bottom: 16px; }
  .modal-field label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .modal-field select,
  .modal-field textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    background: white;
  }
  .modal-field textarea {
    resize: vertical;
    min-height: 80px;
  }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 8px;
  }

  /* Audit log */
  .audit-table {
    width: 100%;
    border-collapse: collapse;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .audit-table th {
    text-align: left;
    padding: 10px 14px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
  }
  .audit-table td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    vertical-align: top;
  }
  .audit-table tr:last-child td { border-bottom: none; }

  .action-pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
  }
  .action-Accepted { background: #DCFCE7; color: #166534; }
  .action-Overridden { background: #FEE2E2; color: #991B1B; }

  .truncate {
    max-width: 280px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: ui-monospace, 'SF Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
  }

  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--text);
    color: white;
    padding: 12px 16px;
    border-radius: 6px;
    font-size: 13px;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    z-index: 200;
  }
  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }
</style>
</head>
<body>

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2 class="sidebar-title">Claims Queue</h2>
    </div>
    <div id="sidebar-list"></div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="main-toolbar">
      <button class="tab active" data-view="dashboard">Claim Detail</button>
      <button class="tab" data-view="audit">Audit Log</button>
    </div>

    <div class="main-content" id="main-content"></div>
  </main>
</div>

<!-- Override modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 class="modal-title">Override Recommendation</h3>
    <div class="modal-field">
      <label for="override-reason">Reason for override</label>
      <select id="override-reason">
        <option>Model missed damage</option>
        <option>Severity wrong</option>
        <option>Cost estimate off</option>
        <option>Fraud suspected</option>
        <option>Other</option>
      </select>
    </div>
    <div class="modal-field">
      <label for="override-context">Additional context</label>
      <textarea id="override-context" placeholder="Add any relevant details..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="modal-submit">Submit Override</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// --- DATA ---
const FALLBACK = "https://placehold.co/800x600/E5E7EB/6B7280?text=Damage+Photo";
const FALLBACK_SM = "https://placehold.co/200x150/E5E7EB/6B7280?text=Angle";

// Stock images of car damage from Unsplash. onerror falls back to placehold.co.
const IMG = {
  bumper:  "https://images.unsplash.com/photo-1597007030739-6d2e7172ee0a?w=800&auto=format&fit=crop",
  bumper2: "https://images.unsplash.com/photo-1605618826115-fb9e0eb5c5d6?w=400&auto=format&fit=crop",
  bumper3: "https://images.unsplash.com/photo-1632823469850-2f77dd9c7d93?w=400&auto=format&fit=crop",
  bumper4: "https://images.unsplash.com/photo-1583349562384-ad525c8c2860?w=400&auto=format&fit=crop",
  scratch: "https://images.unsplash.com/photo-1486006920555-c77dcf18193c?w=800&auto=format&fit=crop",
  side:    "https://images.unsplash.com/photo-1517524008697-84bbe3c3fd98?w=800&auto=format&fit=crop",
};

const claims = [
  {
    id: "CLM-2024-001",
    name: "Marcus Rivera",
    date: "May 2, 2026",
    value: "$4,200",
    routing: "agent",
    routingLabel: "Awaiting Agent Review",
    bannerTitle: "Routed to agent review",
    rationale: "Severity confidence 73% — below 80% auto-resolve threshold.",
    photo: IMG.bumper,
    thumbs: [IMG.bumper2, IMG.bumper3, IMG.bumper4],
    damageType: "Front bumper, hood",
    panels: ["Front bumper", "Hood", "Right headlight assembly"],
    severity: "Moderate",
    repairLow: 3800,
    repairHigh: 4600,
    confidence: { damage: 94, panel: 88, severity: 73, cost: 81 },
    overallConf: 73,
  },
  {
    id: "CLM-2024-002",
    name: "Priya Shah",
    date: "May 1, 2026",
    value: "$1,180",
    routing: "auto",
    routingLabel: "Auto-Resolved",
    bannerTitle: "Auto-resolved",
    rationale: "All confidence signals above threshold. Approved without review.",
    photo: IMG.scratch,
    thumbs: [IMG.bumper2, IMG.bumper4, IMG.bumper3],
    damageType: "Rear quarter panel scratch",
    panels: ["Rear quarter panel (left)"],
    severity: "Minor",
    repairLow: 950,
    repairHigh: 1300,
    confidence: { damage: 96, panel: 95, severity: 92, cost: 91 },
    overallConf: 93,
  },
  {
    id: "CLM-2024-003",
    name: "Daniel Okonkwo",
    date: "Apr 30, 2026",
    value: "$11,800",
    routing: "senior",
    routingLabel: "Escalated to Senior Adjuster",
    bannerTitle: "Escalated — fraud signal detected",
    rationale: "Damage pattern inconsistent with reported incident. Flagged for senior adjuster review.",
    photo: IMG.side,
    thumbs: [IMG.bumper3, IMG.bumper2, IMG.bumper4],
    damageType: "Driver-side door, side panel",
    panels: ["Driver door", "Front fender (left)", "Rocker panel"],
    severity: "Severe",
    repairLow: 9200,
    repairHigh: 12400,
    confidence: { damage: 89, panel: 84, severity: 78, cost: 70 },
    overallConf: 80,
  },
];

const auditLog = [
  { ts: "2026-05-04 14:32", id: "CLM-2024-098", output: "Severity: Moderate, $3,400-$4,100", action: "Accepted", reason: "" },
  { ts: "2026-05-04 13:15", id: "CLM-2024-097", output: "Severity: Minor, $620-$840", action: "Overridden", reason: "Model missed damage" },
  { ts: "2026-05-04 11:48", id: "CLM-2024-096", output: "Severity: Severe, $8,800-$10,200", action: "Accepted", reason: "" },
  { ts: "2026-05-03 16:21", id: "CLM-2024-095", output: "Severity: Moderate, $2,900-$3,500", action: "Overridden", reason: "Severity wrong" },
  { ts: "2026-05-03 10:04", id: "CLM-2024-094", output: "Severity: Minor, $410-$580", action: "Accepted", reason: "" },
  { ts: "2026-05-02 17:55", id: "CLM-2024-093", output: "Severity: Moderate, $5,100-$5,900", action: "Overridden", reason: "Cost estimate off" },
];

// --- STATE ---
let selectedId = "CLM-2024-001";
let view = "dashboard";

// --- HELPERS ---
const $ = (sel) => document.querySelector(sel);

function confClass(v) {
  if (v >= 85) return "conf-high";
  if (v >= 75) return "conf-mid";
  return "conf-low";
}

function imgWithFallback(src, fallback, cls) {
  return `<img src="${src}" class="${cls}" onerror="this.onerror=null;this.src='${fallback}'" alt="" />`;
}

// --- RENDER SIDEBAR ---
function renderSidebar() {
  const groups = [
    { key: "agent",  label: "Awaiting Agent Review",     dotCls: "orange" },
    { key: "auto",   label: "Auto-Resolved",             dotCls: "green" },
    { key: "senior", label: "Escalated to Senior Adjuster", dotCls: "red" },
  ];

  const html = groups.map(g => {
    const items = claims.filter(c => c.routing === g.key);
    const itemsHtml = items.map(c => `
      <div class="claim-item ${c.id === selectedId ? 'selected' : ''}" data-id="${c.id}">
        ${imgWithFallback(c.thumbs[0], FALLBACK_SM, "claim-thumb")}
        <div class="claim-meta">
          <div class="claim-id">${c.id}</div>
          <div class="claim-name">${c.name}</div>
          <div class="claim-conf">Confidence: ${c.overallConf}%</div>
        </div>
      </div>
    `).join("");
    return `
      <div class="sidebar-section">
        <div class="section-header">
          <span class="dot ${g.dotCls}"></span>
          <span>${g.label}</span>
        </div>
        ${itemsHtml || '<div class="claim-item" style="color:var(--text-muted);font-size:12px;">No claims</div>'}
      </div>
    `;
  }).join("");

  $("#sidebar-list").innerHTML = html;

  document.querySelectorAll(".claim-item[data-id]").forEach(el => {
    el.addEventListener("click", () => {
      selectedId = el.dataset.id;
      view = "dashboard";
      document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.view === "dashboard"));
      renderSidebar();
      renderMain();
    });
  });
}

// --- RENDER MAIN ---
function renderMain() {
  if (view === "audit") {
    renderAudit();
    return;
  }
  const c = claims.find(x => x.id === selectedId);
  const bannerCls = c.routing === "auto" ? "green" : c.routing === "senior" ? "red" : "orange";

  const confidenceHtml = [
    ["Damage detection", c.confidence.damage],
    ["Panel identification", c.confidence.panel],
    ["Severity", c.confidence.severity],
    ["Cost estimate", c.confidence.cost],
  ].map(([label, val]) => `
    <div class="confidence-row">
      <div class="confidence-label">
        <span>${label}</span>
        <span style="font-weight:500;">${val}%</span>
      </div>
      <div class="confidence-bar-wrap">
        <div class="confidence-bar ${confClass(val)}" style="width:${val}%"></div>
      </div>
    </div>
  `).join("");

  $("#main-content").innerHTML = `
    <div class="claim-header">
      <div class="claim-header-left">
        <div class="claim-header-id">${c.id}</div>
        <h1 class="claim-header-name">${c.name}</h1>
        <div class="claim-header-date">Filed ${c.date}</div>
      </div>
      <div>
        <div class="claim-header-value-label">Claim value</div>
        <div class="claim-header-value">${c.value}</div>
      </div>
    </div>

    <div class="banner ${bannerCls}">
      <span class="dot ${bannerCls}"></span>
      <span><span class="banner-title">${c.bannerTitle}:</span> <span class="banner-rationale">${c.rationale}</span></span>
    </div>

    <div class="columns">
      <div>
        ${imgWithFallback(c.photo, FALLBACK, "photo-main")}
        <div class="photo-thumbs">
          ${c.thumbs.map(t => imgWithFallback(t, FALLBACK_SM, "photo-thumb")).join("")}
        </div>
      </div>
      <div class="card">
        <h3 class="card-title">Assessment</h3>
        <div class="field">
          <div class="field-label">Damage type</div>
          <div class="field-value">${c.damageType}</div>
        </div>
        <div class="field">
          <div class="field-label">Affected panels</div>
          <div class="field-value">${c.panels.join(", ")}</div>
        </div>
        <div class="field">
          <div class="field-label">Severity</div>
          <div><span class="severity-badge severity-${c.severity}">${c.severity}</span></div>
        </div>
        <div class="field">
          <div class="field-label">Estimated repair range</div>
          <div class="field-value">$${c.repairLow.toLocaleString()} – $${c.repairHigh.toLocaleString()}</div>
        </div>
        <div class="confidence-section">
          <div class="field-label" style="margin-bottom:10px;">Confidence breakdown</div>
          ${confidenceHtml}
        </div>
      </div>
    </div>

    <div class="action-bar">
      <button class="btn btn-primary" id="btn-accept">Accept Recommendation</button>
      <button class="btn btn-secondary" id="btn-override">Override</button>
    </div>
  `;

  $("#btn-accept").addEventListener("click", () => showToast(`Accepted recommendation for ${c.id}`));
  $("#btn-override").addEventListener("click", () => $("#modal").classList.add("open"));
}

function renderAudit() {
  const rows = auditLog.map(r => `
    <tr>
      <td style="white-space:nowrap;color:var(--text-muted);">${r.ts}</td>
      <td style="font-weight:500;">${r.id}</td>
      <td><div class="truncate" title="${r.output}">${r.output}</div></td>
      <td><span class="action-pill action-${r.action}">${r.action}</span></td>
      <td style="color:var(--text-muted);">${r.reason || "—"}</td>
    </tr>
  `).join("");

  $("#main-content").innerHTML = `
    <h1 style="font-size:22px;font-weight:600;margin:0 0 4px 0;">Audit Log</h1>
    <p style="color:var(--text-muted);margin:0 0 20px 0;">Recent agent decisions on model recommendations.</p>
    <table class="audit-table">
      <thead>
        <tr>
          <th>Timestamp</th>
          <th>Claim ID</th>
          <th>Model Output</th>
          <th>Agent Action</th>
          <th>Reason</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

// --- TOAST ---
let toastTimer;
function showToast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

// --- TABS ---
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    view = tab.dataset.view;
    renderMain();
  });
});

// --- MODAL ---
$("#modal-cancel").addEventListener("click", () => $("#modal").classList.remove("open"));
$("#modal").addEventListener("click", (e) => {
  if (e.target.id === "modal") $("#modal").classList.remove("open");
});
$("#modal-submit").addEventListener("click", () => {
  const reason = $("#override-reason").value;
  $("#modal").classList.remove("open");
  $("#override-context").value = "";
  showToast(`Override submitted: ${reason}`);
});

// --- INIT ---
renderSidebar();
renderMain();
</script>
</body>
</html>
